<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article</title>
    <style>
      @page {
        margin: 18mm 16mm;
      }
      :root {
        --text: #1a1a1f;
        --muted: #5f5f6b;
        --rule: #e2e2e8;
        --accent: #e4205f;
      }
      body {
        margin: 0 auto;
        padding: 32px 16px 48px;
        max-width: 680px;
        background: #fff;
        color: var(--text);
        font-family: 'Inter Variable', system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.65;
        font-feature-settings: 'cv11', 'ss01';
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      header {
        margin-bottom: 28px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--rule);
      }
      .site {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 30px;
        font-weight: 750;
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      .meta,
      .source {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .source {
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .source a {
        color: inherit;
      }
      main h2,
      main h3,
      main h4 {
        margin: 1.8em 0 0.5em;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.01em;
        break-after: avoid;
      }
      main h2 {
        font-size: 21px;
      }
      main h3,
      main h4 {
        font-size: 18px;
      }
      main p {
        margin: 0 0 1em;
        text-wrap: pretty;
        hyphens: auto;
        orphans: 3;
        widows: 3;
      }
      main a {
        color: inherit;
        text-decoration-color: var(--rule);
        text-underline-offset: 2px;
      }
      blockquote {
        margin: 1.5em 0;
        padding: 0 0 0 16px;
        border-left: 3px solid var(--accent);
        font-size: 18px;
        font-weight: 500;
        line-height: 1.5;
      }
      img,
      video,
      iframe {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 4px;
      }
      figure {
        margin: 24px 0;
        break-inside: avoid;
      }
      figcaption {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }
      ul,
      ol {
        padding-left: 1.4em;
      }
      li {
        margin-bottom: 0.4em;
      }
      pre {
        white-space: pre-wrap;
      }
      .status.error {
        color: #b00020;
      }
      @media print {
        body {
          padding: 0;
          max-width: none;
        }
        .status {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="status">Extracting the article…</p>
    <script type="module" src="./print.ts"></script>
  </body>
</html>
