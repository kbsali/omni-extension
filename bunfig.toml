[fmt]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = true
trailingComma = "es5"
arrowParens = "always"
endOfLine = "lf"
sortImports = true
sortPackageJson = true
ignorePatterns = [
  "**/*.svelte",
  ".dashboard/**",
  "docs/**",
  "dist/**",
  "coverage/**",
  "test-results/**",
  "playwright-report/**",
]
